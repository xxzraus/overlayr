name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! A screenshot and your Windows version make fixing it much faster.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Music
        2. Enable "Collapse to an icon"
        3. Hover the overlay
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Overlayr version
      placeholder: 1.3.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images here, or paste anything from the console if you have it.
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I checked that the issue is not already reported
          required: true
