name: Feature request
description: Suggest an idea, a feature or an improvement for Overlayr
title: "[Idea] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Overlayr! Tell us what you do every day and what would make it nicer.
  - type: textarea
    id: problem
    attributes:
      label: What are you missing?
      description: Describe the situation — which app, which task, what feels inconvenient right now.
      placeholder: I switch themes several times a day and would like ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like it to work?
      description: A rough idea is enough — a hotkey, a toggle, a panel, a setting.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Screenshots, links, examples from other apps, or workarounds you use today.
  - type: input
    id: version
    attributes:
      label: Overlayr version
      placeholder: 1.3.1
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I checked the roadmap and existing issues
          required: true
