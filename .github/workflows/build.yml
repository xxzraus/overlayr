name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build native helpers
        run: npm run build:tools

      - name: Fetch rcedit
        run: |
          New-Item -ItemType Directory -Force -Path .buildtools | Out-Null
          Invoke-WebRequest -Uri https://github.com/electron/rcedit/releases/latest/download/rcedit-x64.exe -OutFile .buildtools/rcedit.exe

      - name: Build portable package
        run: npm run build:portable

      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          "MAKENSIS=C:\Program Files (x86)\NSIS\makensis.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        run: npm run build:installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overlayr-windows
          path: |
            dist/Overlayr-Setup-*.exe
            dist/Overlayr-portable-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Overlayr-Setup-*.exe
            dist/Overlayr-portable-*.zip
          overwrite_files: true
          fail_on_unmatched_files: false
